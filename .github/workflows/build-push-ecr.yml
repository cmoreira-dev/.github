name: Build and push to ECR

on:
  workflow_call:
    inputs:
      ecr_repository:
        required: true
        type: string
      aws_region:
        required: true
        type: string
      aws_role_arn:
        required: true
        type: string
      platforms:
        required: false
        type: string
        default: "linux/amd64,linux/arm64"
      context:
        description: Build context (subfolder for monorepos). Defaults to the repo root.
        required: false
        type: string
        default: "."
      file:
        description: Dockerfile path. Empty = <context>/Dockerfile (docker default).
        required: false
        type: string
        default: ""
      cache_scope:
        description: Enables the GitHub Actions build cache under this scope. Empty = no cache.
        required: false
        type: string
        default: ""

permissions:
  id-token: write   # necessário pro OIDC
  contents: read

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ inputs.aws_role_arn }}
          aws-region: ${{ inputs.aws_region }}

      - name: Login no ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Gerar tags da imagem
        id: tags
        run: |
          # Sem "latest": os repos ECR têm image_tag_mutability=IMMUTABLE, então
          # tentar reempurrar "latest" a cada build em main falha (tag já existe,
          # não pode ser sobrescrita) — e o argocd-image-updater (update-strategy
          # newest-build) já rastreia a tag do SHA diretamente, "latest" não é
          # mais usado por nada no deploy.
          SHA_TAG="${GITHUB_SHA::7}"
          TAGS="$SHA_TAG"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAGS="$TAGS,${{ github.ref_name }}"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Exposes ACTIONS_RUNTIME_TOKEN/cache URL to the docker CLI (needed for type=gha).
      - name: Expose GitHub runtime for build cache
        if: inputs.cache_scope != ''
        uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0

      - name: Build and push (multi-arch)
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          REPOSITORY: ${{ inputs.ecr_repository }}
          TAGS: ${{ steps.tags.outputs.tags }}
          PLATFORMS: ${{ inputs.platforms }}
          CONTEXT: ${{ inputs.context }}
          DOCKERFILE: ${{ inputs.file }}
          CACHE_SCOPE: ${{ inputs.cache_scope }}
        run: |
          EXTRA_ARGS=()
          if [ -n "$DOCKERFILE" ]; then
            EXTRA_ARGS+=(--file "$DOCKERFILE")
          fi
          if [ -n "$CACHE_SCOPE" ]; then
            EXTRA_ARGS+=(--cache-from "type=gha,scope=$CACHE_SCOPE" --cache-to "type=gha,mode=max,scope=$CACHE_SCOPE")
          fi

          TAG_ARGS=()
          IFS=',' read -ra TAG_LIST <<< "$TAGS"
          for t in "${TAG_LIST[@]}"; do
            TAG_ARGS+=(-t "$REGISTRY/$REPOSITORY:$t")
          done

          docker buildx build \
            --platform "$PLATFORMS" \
            "${TAG_ARGS[@]}" \
            "${EXTRA_ARGS[@]}" \
            --push \
            "$CONTEXT"
